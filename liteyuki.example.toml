# LiteyukiBot configuration schema. Do not edit config_version manually.
config_version = 7

[core]
data_dir = "data"
cache_dir = "cache"
queue_capacity = 1024
enqueue_timeout_seconds = 1.0
handler_timeout_seconds = 30.0
max_concurrent_events = 100

[logging]
level = "INFO"
console = true
json_lines = false
payload_mode = "metadata"

[i18n]
locale = "auto"

[cordis]
enabled = []
config = {}

[permissions]
grants = []
roles = {}

[commands]
prefixes = ["/"]

[resources]

[profile]

[essentials]
language = "zh-CN"

# Add accounts to enable the OneBot v11 adapter.
[onebot.v11.accounts]
# [onebot.v11.accounts.qq-main]
