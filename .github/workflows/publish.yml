name: Publish LiteyukiBot

on:
  push:
    tags:
      - "v7.*"
      - "!v7.*a*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact project version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    environment: pypi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
      - name: Install Python
        run: uv python install 3.14
      - name: Require published Yukilog 1.x
        run: uv run --no-project --python 3.14 --with "yukilog>=1,<2" python -c "import yukilog"
      - name: Validate release identity
        run: uv run --no-project --python 3.14 python scripts/check_release.py --tag "$RELEASE_TAG" --reject-alpha
      - name: Build distribution
        run: |
          uv build
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --no-project --python 3.14 python scripts/run_isolated_install.py \
            --with "$wheel" --verifier scripts/verify_published_install.py -- \
            --expected-version "${RELEASE_TAG#v}" --expect-kernel --expect-cordis \
            --expect-adapter-onebot --expect-no-legacy-runtime
      - name: Publish distribution
        run: uv publish
