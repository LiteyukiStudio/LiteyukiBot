name: Publish LiteyukiBot Packages

on:
  push:
    tags:
      - "kernel-v*"
      - "!kernel-v7.*a*"
      - "cordis-v*"
      - "!cordis-v7.*a*"
      - "adapter-onebot-v*"
      - "!adapter-onebot-v7.*a*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - kernel
          - cordis
          - adapter-onebot
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-v{1}', inputs.package, inputs.version) || github.ref_name }}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && format('pypi-{0}', inputs.package) || startsWith(github.ref_name, 'kernel-v') && 'pypi-kernel' || startsWith(github.ref_name, 'cordis-v') && 'pypi-cordis' || 'pypi-adapter-onebot' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
      - name: Install Python
        run: uv python install 3.14
      - name: Resolve and validate release
        id: release
        run: >-
          uv run --no-project --python 3.14 python scripts/check_release.py
          --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT" --reject-alpha
      - name: Build distribution
        run: uv build --project "${{ steps.release.outputs.project }}" --out-dir dist/release --clear
      - name: Generate SBOM and artifact manifest
        run: |
          uv export --project "${{ steps.release.outputs.project }}" --no-dev --no-emit-project \
            --format requirements.txt --output-file dist/release/requirements.txt
          uv run --group release cyclonedx-py requirements dist/release/requirements.txt \
            --pyproject "${{ steps.release.outputs.project }}/pyproject.toml" --output-reproducible \
            --output-file dist/release/sbom.cdx.json
          uv run --group release python scripts/generate_supply_chain.py \
            --project "${{ steps.release.outputs.project }}" --dist dist/release
      - name: Verify package wheel with published dependencies
        run: |
          wheel="$(find dist/release -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --no-project --python 3.14 python scripts/run_isolated_install.py \
            --with "$wheel" --verifier "${{ steps.release.outputs.verifier }}" -- \
            --expected-version "${{ steps.release.outputs.version }}"
      - name: Publish package distribution
        run: uv publish dist/release/*.whl dist/release/*.tar.gz
