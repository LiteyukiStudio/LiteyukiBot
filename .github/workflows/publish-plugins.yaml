name: Publish LiteyukiBot Plugins

on:
  push:
    tags:
      - "permissions-v*"
      - "commands-v*"
      - "resources-v*"
      - "profile-v*"
      - "essentials-v*"
      - "runtime-nonebot-v*"
      - "runtime-v6-v*"
      - "agent-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Plugin package to publish
        required: true
        type: choice
        options:
          - permissions
          - commands
          - resources
          - profile
          - essentials
          - runtime-nonebot
          - runtime-v6
          - agent
      version:
        description: Exact plugin version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-v{1}', inputs.package, inputs.version) || github.ref_name }}
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && format('pypi-{0}', inputs.package) || startsWith(github.ref_name, 'permissions-v') && 'pypi-permissions' || startsWith(github.ref_name, 'commands-v') && 'pypi-commands' || startsWith(github.ref_name, 'resources-v') && 'pypi-resources' || startsWith(github.ref_name, 'profile-v') && 'pypi-profile' || startsWith(github.ref_name, 'runtime-nonebot-v') && 'pypi-runtime-nonebot' || startsWith(github.ref_name, 'runtime-v6-v') && 'pypi-runtime-v6' || startsWith(github.ref_name, 'agent-v') && 'pypi-agent' || 'pypi-essentials' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.16"
      - name: Install Python
        run: uv python install 3.14
      - name: Resolve and validate release
        id: release
        run: >-
          uv run --no-project --python 3.14 python scripts/check_release.py
          --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Build plugin distribution
        run: >-
          uv build --project "${{ steps.release.outputs.project }}"
          --out-dir dist/release --clear
      - name: Verify plugin wheel with published dependencies
        run: |
          wheel="$(find dist/release -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --no-project --python 3.14 python scripts/run_isolated_install.py \
            --with "$wheel" --verifier "${{ steps.release.outputs.verifier }}" -- \
            --expected-version "${{ steps.release.outputs.version }}"
      - name: Publish plugin distribution
        run: uv publish dist/release/*
