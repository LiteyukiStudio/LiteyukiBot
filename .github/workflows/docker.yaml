name: v7 Docker

on:
  pull_request:
    branches: [v7]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yaml
      - liteyuki.example.toml
      - pyproject.toml
      - packages/runtime-nonebot/**
      - packages/runtime-v6/**
      - src/**
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: liteyukibot:v7-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
