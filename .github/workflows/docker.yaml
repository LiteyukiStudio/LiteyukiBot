name: v7 Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yaml
      - liteyuki.example.toml
      - pyproject.toml
      - packages/kernel/**
      - packages/cordis/**
      - packages/adapter-onebot/**
      - src/**
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: liteyukibot:v7-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm liteyukibot:v7-ci version

      - name: Validate image configuration
        run: docker run --rm liteyukibot:v7-ci check

      - name: Smoke test application lifecycle
        run: |
          container_id="$(docker run --detach liteyukibot:v7-ci run)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          sleep 2
          test "$(docker inspect --format='{{.State.Running}}' "$container_id")" = "true"
          docker stop --time 10 "$container_id"
          exit_code="$(docker wait "$container_id")"
          test "$exit_code" = "0"
          test "$(docker inspect --format='{{.State.OOMKilled}}' "$container_id")" = "false"
