name: Build LiteyukiBot Alpha Bundle

on:
  push:
    tags: ["v7.0.0a*"]

permissions:
  contents: write
  id-token: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install locked workspace
        run: |
          uv python install 3.14
          uv sync --locked --all-packages
      - name: Validate Alpha source registry
        run: |
          uv run python scripts/check_release.py --tag "$RELEASE_TAG"
          uv run --group release python -m scripts.alpha_release check-source
      - name: Build target distributions
        run: |
          uv build --project packages/kernel --out-dir dist/alpha
          uv build --project packages/cordis --out-dir dist/alpha
          uv build --project packages/adapter-onebot --out-dir dist/alpha
          uv build --project . --out-dir dist/alpha
      - name: Download the resolved offline dependency closure
        run: |
          uv export --locked --all-packages --no-dev --no-emit-workspace --format requirements.txt \
            --output-file dist/alpha/dependencies.requirements.txt
          uv run --no-project --with pip python -m pip download \
            --requirement dist/alpha/dependencies.requirements.txt --dest dist/alpha --no-deps
      - name: Generate bundle evidence
        run: uv run --group release python -m scripts.alpha_release generate --dist dist/alpha
      - name: Sign canonical manifest
        run: >-
          uv run --group release sigstore sign
          --bundle dist/alpha/artifacts.manifest.sigstore.json
          dist/alpha/artifacts.manifest.json
      - name: Verify the staged bundle outside the source tree
        run: |
          bundle="$(mktemp -d)"
          cp -a dist/alpha/. "$bundle"
          uv run --group release python -m scripts.alpha_release verify --bundle "$bundle"
          uv run python -m scripts.run_alpha_bundle_installs --bundle "$bundle"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/alpha/* --title "$RELEASE_TAG" --generate-notes
