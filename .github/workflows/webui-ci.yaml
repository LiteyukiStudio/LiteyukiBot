name: WebUI CI

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
      - "packages/webui/**"
      - "src/liteyukibot/daemon.py"
      - "src/liteyukibot/plugins.py"
      - "src/liteyukibot/resource_packs.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/stage_webui_assets.py"
      - "scripts/run_webui_install.py"
      - "scripts/verify_webui_install.py"
      - ".github/workflows/webui-ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "webui/**"
      - "packages/webui/**"
      - "src/liteyukibot/daemon.py"
      - "src/liteyukibot/plugins.py"
      - "src/liteyukibot/resource_packs.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/stage_webui_assets.py"
      - "scripts/run_webui_install.py"
      - "scripts/verify_webui_install.py"
      - ".github/workflows/webui-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: LiteyukiBot
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.3
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: LiteyukiBot/.node-version
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install WebUI workspace
        working-directory: LiteyukiBot
        run: |
          uv python install 3.14
          uv sync --locked --all-packages --extra server
          pnpm --dir webui install --frozen-lockfile
      - name: Validate WebUI package
        working-directory: LiteyukiBot
        run: |
          pnpm --dir webui build
          pnpm --dir webui audit --prod
          uv run python scripts/stage_webui_assets.py
          uv run python scripts/check_release.py --package webui
          uv run ruff check webui packages/webui scripts/stage_webui_assets.py scripts/run_webui_install.py scripts/verify_webui_install.py
          uv run mypy packages/webui scripts/stage_webui_assets.py scripts/run_webui_install.py scripts/verify_webui_install.py
          uv run pytest packages/webui/tests tests/test_daemon.py tests/test_management.py tests/test_operations.py
          uv build --project packages/kernel --out-dir dist/workspace --clear
          uv build --out-dir dist/workspace
          uv build --project packages/webui --out-dir dist/workspace
          uv run python -m scripts.run_webui_install
      - name: Run browser checks
        working-directory: LiteyukiBot
        run: |
          pnpm --dir webui exec playwright install --with-deps chromium
          pnpm --dir webui test:e2e
