name: v7 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: LiteyukiBot
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.3
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: LiteyukiBot/.node-version
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install Python and dependencies
        working-directory: LiteyukiBot
        run: |
          uv python install 3.14
          uv sync --locked --all-packages --extra onebot --extra satori --extra webui
      - name: Quality checks
        working-directory: LiteyukiBot
        run: |
          pnpm --dir webui install --frozen-lockfile
          pnpm --dir webui build
          uv run python scripts/stage_webui_assets.py
          uv run python scripts/check_release.py
          uv run python scripts/check_release.py --package permissions
          uv run python scripts/check_release.py --package commands
          uv run python scripts/check_release.py --package functions
          uv run python scripts/check_release.py --package essentials
          uv run python scripts/check_release.py --package runtime-nonebot
          uv run python scripts/check_release.py --package runtime-adapter
          uv run python scripts/check_release.py --package adapter-onebot
          uv run python scripts/check_release.py --package adapter-satori
          uv run python scripts/check_release.py --package runtime-v6
          uv run python scripts/check_release.py --package agent
          uv run python scripts/check_release.py --package runtime-astrbot
          uv run python scripts/check_release.py --package runtime-mofox
          uv run python scripts/check_release.py --package webui
          uv run python scripts/check_release.py --package ipc-native
          uv run python scripts/check_api_docs.py
          uv run ruff check src tests scripts examples packages
          uv run mypy
          uv run pytest
          uv run pip-audit --local --progress-spinner off --vulnerability-service osv
          pnpm --dir webui audit --prod
          uv build
          uv build --all-packages --out-dir dist/workspace --clear
          uv run python -m scripts.run_tool_install_smoke
          uv build --project examples/native-plugin --out-dir dist/examples
          uv build --project examples/custom-runtime --out-dir dist/examples
          uv run python -m scripts.run_developer_kit_install
          uv run python -m scripts.run_permissions_install
          uv run python -m scripts.run_commands_install
          uv run python -m scripts.run_functions_install
          uv run python -m scripts.run_cordis_install
          uv run python -m scripts.run_essentials_install
          uv run python -m scripts.run_nonebot_runtime_install
          uv run python -m scripts.run_adapter_runtime_install
          uv run python -m scripts.run_onebot_adapter_install
          uv run python -m scripts.run_satori_adapter_install
          uv run python -m scripts.run_v6_runtime_install
          uv run python -m scripts.run_agent_install
          uv run python -m scripts.run_astrbot_runtime_install
          uv run python -m scripts.run_mofox_runtime_install
          uv run python -m scripts.run_webui_install
          uv run python scripts/run_isolated_install.py --with dist/workspace/liteyukibot_v7-7.0.0a9-py3-none-any.whl --with dist/workspace/liteyukibot_v7_runtime_nonebot_api-7.0.0a9-py3-none-any.whl --verifier scripts/verify_nonebot_api_install.py -- --expected-version 7.0.0a9
          uv run python scripts/run_isolated_install.py --with dist/workspace/liteyukibot_v7-7.0.0a9-py3-none-any.whl --with dist/workspace/liteyukibot_v7_runtime_astrbot_api-7.0.0a9-py3-none-any.whl --verifier scripts/verify_astrbot_api_install.py -- --expected-version 7.0.0a9
          uv build --project examples/broker-peer --out-dir dist/examples
          uv run python scripts/run_isolated_install.py --with dist/workspace/liteyukibot_v7-7.0.0a9-py3-none-any.whl --with dist/examples/liteyukibot_example_broker_peer-0.1.0-py3-none-any.whl --verifier scripts/verify_broker_peer_example.py
          uv run python scripts/run_isolated_install.py --with dist/workspace/liteyukibot_v7-7.0.0a9-py3-none-any.whl --with dist/examples/liteyukibot_example_plugin-0.1.0-py3-none-any.whl --verifier scripts/verify_native_plugin_example.py
      - name: Run WebUI browser checks
        if: matrix.os == 'ubuntu-latest'
        working-directory: LiteyukiBot
        run: |
          pnpm --dir webui exec playwright install --with-deps chromium
          pnpm --dir webui test:e2e
      - name: Capture qualification baselines
        working-directory: LiteyukiBot
        run: |
          uv run python scripts/benchmark_v7.py --profile bare --samples 3 --output benchmark-bare.json
          uv run python scripts/benchmark_v7.py --profile installed-first-party --samples 3 --output benchmark-installed-first-party.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v7-qualification-${{ matrix.os }}
          path: |
            LiteyukiBot/benchmark-bare.json
            LiteyukiBot/benchmark-installed-first-party.json

  published-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: LiteyukiBot
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
      - name: Verify published wheel in isolation
        working-directory: LiteyukiBot
        run: |
          uv python install 3.14
          uv run --no-project --python 3.14 python scripts/run_isolated_install.py --with "liteyukibot-v7>=7.0.0a2,<8" --verifier scripts/verify_published_install.py

  nonebot-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: LiteyukiBot
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
      - name: Run NoneBot runtime contract
        working-directory: LiteyukiBot
        run: |
          uv python install 3.14
          uv sync --locked --all-packages --extra onebot --extra satori
          uv run pytest \
            packages/runtime-nonebot/tests/test_nonebot_adapters.py \
            packages/runtime-nonebot/tests/test_nonebot_bridge.py
