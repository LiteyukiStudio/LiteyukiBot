name: v7 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: LiteyukiBot
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install Python and locked workspace
        working-directory: LiteyukiBot
        run: |
          uv python install 3.14
          uv sync --locked --all-packages
      - name: Validate release registry
        working-directory: LiteyukiBot
        run: |
          uv run python scripts/check_release.py
          uv run python scripts/check_release.py --package kernel
          uv run python scripts/check_release.py --package cordis
          uv run python scripts/check_release.py --package adapter-onebot
      - name: Run quality checks
        working-directory: LiteyukiBot
        run: |
          uv run liteyuki --workspace tmp/ci-workspace init
          uv run liteyuki --workspace tmp/ci-workspace check
          uv run ruff check src tests scripts packages
          uv run mypy
          uv run pytest
          uv run pip-audit --local --progress-spinner off --vulnerability-service osv
      - name: Build all target distributions
        working-directory: LiteyukiBot
        run: uv build --all-packages --out-dir dist/workspace --clear
      - name: Verify target installations
        working-directory: LiteyukiBot
        run: |
          uv run python -m scripts.run_kernel_install
          uv run python -m scripts.run_cordis_install
          uv run python -m scripts.run_onebot_adapter_install
          uv run python -m scripts.run_tool_install_smoke
