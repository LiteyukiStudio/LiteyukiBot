name: Verify public Alpha plugin index

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable Alpha GitHub Release tag
        required: true
        default: v7.0.0a14
      index_url:
        description: Public schema-2 plugin index URL
        required: true
        default: https://raw.githubusercontent.com/LiteyukiStudio/liteyukibot-v7-plugins/main/index.json

permissions:
  contents: read

jobs:
  public-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@11f9893b081b58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
      - name: Download immutable release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist/release
          gh release download "$RELEASE_TAG" --repo LiteyukiStudio/LiteyukiBot --pattern '*.whl' --dir dist/release
          gh release download "$RELEASE_TAG" --repo LiteyukiStudio/LiteyukiBot --pattern 'artifacts.manifest.json' --dir dist/release
      - name: Resolve and verify release identity
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("dist/release/artifacts.manifest.json", encoding="utf-8") as manifest_file:
              release = json.load(manifest_file).get("release")
          tag = os.environ["RELEASE_TAG"]
          valid = (
              isinstance(release, dict)
              and release.get("tag") == tag
              and isinstance(release.get("version"), str)
              and tag == "v" + release["version"]
          )
          if not valid:
              raise SystemExit("release manifest identity does not match the requested tag")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={release['version']}\n")
          PY
      - name: Run public-index NoneBot lifecycle proof
        env:
          INDEX_URL: ${{ inputs.index_url }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          uv run --no-project --python 3.14 --find-links dist/release
          --with "dist/release/liteyukibot_v7-${RELEASE_VERSION}-py3-none-any.whl"
          --with "dist/release/liteyukibot_v7_runtime_nonebot-${RELEASE_VERSION}-py3-none-any.whl"
          python scripts/run_nonebot_plugin_e2e.py
          --wheel-dir dist/release
          --workspace tmp/alpha-public-nonebot-e2e
          --index-url "$INDEX_URL"
