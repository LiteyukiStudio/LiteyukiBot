[project]
name = "liteyukibot-v7-runtime-astrbot"
version = "7.0.0a9"
description = "AstrBot platform gateway for the LiteyukiBot v7 broker."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "h2>=4.4.1,<5",
    "liteyukibot-v7==7.0.0a9",
    "liteyukibot-v7-runtime-astrbot-api==7.0.0a9",
    "AstrBot==4.27.2",
]

[project.entry-points."liteyukibot.bridges"]
astrbot = "liteyukibot_runtime_astrbot:bridge_definition"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }
liteyukibot-v7-runtime-astrbot-api = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_runtime_astrbot"
