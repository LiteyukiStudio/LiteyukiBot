[project]
name = "liteyukibot-v7-runtime-v6"
version = "0.1.0a2"
description = "Bounded LiteyukiBot v6 compatibility runtime for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
license-files = ["LICENSE"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7>=7.0.0a1,<8",
]

[project.entry-points."liteyukibot.bridges"]
v6 = "liteyukibot_runtime_v6:bridge_definition"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = ["liteyukibot_runtime_v6", "liteyuki"]
