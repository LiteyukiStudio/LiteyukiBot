[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "liteyukibot-v7-runtime-cordis"
version = "0.1.0b1"
description = "First-party Cordis processor runtime for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
license-files = ["LICENSE"]
authors = [{ name = "LiteyukiStudio" }]
dependencies = [
    "liteyukibot-v7>=7.0.0b5,<8",
]

[project.entry-points."liteyukibot.runtimes"]
cordis = "liteyukibot_runtime_cordis:runtime_plugin"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }

[tool.maturin]
python-source = "python"
module-name = "liteyukibot_runtime_cordis._native"
manifest-path = "Cargo.toml"
bindings = "pyo3"
