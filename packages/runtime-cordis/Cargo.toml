[package]
name = "liteyukibot-runtime-cordis"
version = "0.1.0-beta.1"
edition = "2024"
description = "First-party Cordis processor runtime for LiteyukiBot v7."
license-file = "LICENSE"
repository = "https://github.com/LiteyukiStudio/LiteyukiBot"
rust-version = "1.85"
publish = false

[lib]
name = "liteyukibot_runtime_cordis_native"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[[bin]]
name = "liteyuki-cordis"
path = "rust/src/main.rs"

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
