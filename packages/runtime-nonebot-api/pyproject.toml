[project]
name = "liteyukibot-v7-runtime-nonebot-api"
version = "7.0.0a12"
description = "Framework-neutral typed NoneBot runtime API facade."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [{ name = "LiteyukiStudio" }]
dependencies = [
    "liteyukibot-v7==7.0.0a12",
]

[project.entry-points."liteyukibot.runtime_api_proxies"]
"nonebot.event" = "liteyukibot_runtime_nonebot_api:event_proxy_factory"
"nonebot.bot" = "liteyukibot_runtime_nonebot_api:bot_proxy_factory"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_runtime_nonebot_api"
