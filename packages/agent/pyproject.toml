[project]
name = "liteyukibot-v7-agent"
version = "0.1.0a9"
description = "Experimental Agent and sandbox bridges for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7>=7.0.0a1,<8",
    "liteyukibot-v7-agent-resolver==0.2.0a1",
    "liteyukibot-v7-permissions==0.3.0a2",
    "openai>=2,<3",
]

[project.entry-points."liteyukibot.bridges"]
agent = "liteyukibot_agent:bridge_definition"
"agent-sandbox" = "liteyukibot_agent:sandbox_bridge_definition"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }
liteyukibot-v7-agent-resolver = { workspace = true }
liteyukibot-v7-permissions = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_agent"
