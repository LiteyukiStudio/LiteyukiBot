[project]
name = "liteyukibot-v7-agent"
version = "0.1.0a9"
description = "Native OpenAI-compatible agent harness for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7>=7.0.0a17,<8",
    "liteyukibot-v7-commands>=0.2.0a2,<0.3",
    "liteyukibot-v7-agent-resolver>=0.1.0a1,<0.2",
    "openai>=2,<3",
]

[project.entry-points."liteyukibot.runtimes"]
agent = "liteyukibot_agent:runtime_plugin"

[project.entry-points."liteyukibot.plugins"]
"liteyukibot.agent" = "liteyukibot_agent:plugin"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }
liteyukibot-v7-commands = { workspace = true }
liteyukibot-v7-agent-resolver = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_agent"
