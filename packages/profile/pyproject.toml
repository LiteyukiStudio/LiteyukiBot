[project]
name = "liteyukibot-v7-profile"
version = "0.2.0a1"
description = "Persistent per-bot user profiles for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7==7.0.0a14",
    "liteyukibot-v7-resources==0.2.0a1",
]

[project.entry-points."liteyukibot.plugins"]
"liteyukibot.profile" = "liteyukibot_profile:plugin"

[project.entry-points."liteyukibot.cordis_plugins"]
"liteyukibot.profile" = "liteyukibot_profile.cordis:cordis_plugin"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }
liteyukibot-v7-resources = { workspace = true }
liteyukibot-v7-cordis = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_profile"
