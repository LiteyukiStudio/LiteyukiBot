[project]
name = "liteyukibot-v7-agent-resolver"
version = "0.1.0a1"
description = "Declarative agent module and tool resolver for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
authors = [
    { name = "LiteyukiStudio" },
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_agent_resolver"
