[project]
name = "liteyukibot-v7-runtime-nonebot"
version = "0.1.0a1"
description = "NoneBot2 runtime host for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
license-files = ["LICENSE"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7>=7.0.0a3,<8",
    "nonebot2[fastapi,httpx,websockets]>=2.5,<3",
]

[project.optional-dependencies]
onebot = [
    "nonebot-adapter-onebot>=2.4,<3",
]
satori = [
    "nonebot-adapter-satori>=1.3,<2",
]

[project.entry-points."liteyukibot.runtimes"]
nonebot = "liteyukibot_runtime_nonebot:runtime_plugin"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_runtime_nonebot"
