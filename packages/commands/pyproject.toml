[project]
name = "liteyukibot-v7-commands"
version = "0.3.0a1"
description = "Protocol-neutral command routing for LiteyukiBot v7 native plugins."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7==7.0.0a14",
    "liteyukibot-v7-permissions==0.3.0a2",
]

[project.entry-points."liteyukibot.plugins"]
"liteyukibot.commands" = "liteyukibot_commands:plugin"

[project.entry-points."liteyukibot.cordis_plugins"]
"liteyukibot.commands" = "liteyukibot_commands.cordis:cordis_plugin"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }
liteyukibot-v7-permissions = { workspace = true }
liteyukibot-v7-cordis = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_commands"
