[project]
name = "liteyukibot-v7-runtime-mofox"
version = "0.1.0a6"
description = "Headless Neo-MoFox agent runtime for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7>=7.0.0a15,<8",
    "neo-mofox @ git+https://github.com/MoFox-Studio/Neo-MoFox.git@e2ee2ff73b494428bbdfd983c7569c6f074a9c76",
]

[project.entry-points."liteyukibot.runtimes"]
mofox = "liteyukibot_runtime_mofox:runtime_plugin"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_runtime_mofox"
