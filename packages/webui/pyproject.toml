[project]
name = "liteyukibot-v7-webui"
version = "7.0.0a14"
description = "Local WebUI distribution wrapper for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7==7.0.0a14",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "python-multipart>=0.0.20,<1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_webui"
