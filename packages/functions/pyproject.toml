[project]
name = "liteyukibot-v7-functions"
version = "0.1.0a3"
description = "Alpha 7 LYF parser and bounded runtime for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
license-files = ["LICENSE"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "jsonschema>=4.26,<5",
    "lark>=1.3,<2",
    "liteyukibot-v7==7.0.0a8",
]

[project.entry-points."liteyukibot.function_executors"]
v6 = "liteyukibot_functions:V6FunctionExecutor"

[project.entry-points."liteyukibot.function_hosts"]
lyf = "liteyukibot_functions:Alpha7FunctionHostProvider"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_functions"
