[project]
name = "liteyukibot-v7-adapter-onebot"
version = "0.1.0a1"
description = "Native OneBot v11/v12 protocol adapters for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7-runtime-adapter==7.0.0a14",
    "websockets>=15,<16",
]

[project.entry-points."liteyukibot.adapters"]
onebot-v11 = "liteyukibot_adapter_onebot:onebot_v11_plugin"
onebot-v12 = "liteyukibot_adapter_onebot:onebot_v12_plugin"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7-runtime-adapter = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_adapter_onebot"
