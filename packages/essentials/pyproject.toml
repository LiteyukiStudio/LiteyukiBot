[project]
name = "liteyukibot-v7-essentials"
version = "0.1.0a1"
description = "Essential help and status commands for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
license-files = ["LICENSE"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7>=7.0.0a3,<8",
    "liteyukibot-v7-commands>=0.1.0a1,<0.2",
]

[project.entry-points."liteyukibot.plugins"]
"liteyukibot.essentials" = "liteyukibot_essentials:plugin"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }
liteyukibot-v7-commands = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_essentials"
