[project]
name = "liteyukibot-v7-broker"
version = "7.0.0a14"
description = "Standalone authenticated Broker peer and bridge host primitives for LiteyukiBot v7."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [{ name = "LiteyukiStudio" }]
dependencies = [
    "liteyukibot-v7-kernel==7.0.0a14",
    "jsonschema>=4.26,<5",
    "pydantic>=2.13,<3",
    "pyzmq>=27.1.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
liteyukibot-v7-kernel = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_broker"
