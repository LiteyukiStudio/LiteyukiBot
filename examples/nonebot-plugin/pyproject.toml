[project]
name = "liteyukibot-v7-example-nonebot-plugin"
version = "0.1.0"
description = "Reference NoneBot plugin for LiteyukiBot v7 managed generations."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "nonebot2>=2.5,<3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot_example_nonebot_plugin"
