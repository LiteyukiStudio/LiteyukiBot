[project]
name = "liteyukibot-v7"
version = "7.0.0b2"
description = "A protocol-neutral, multi-runtime chatbot kernel."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
license-files = ["LICENSE"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "cryptography>=46,<51",
    "filelock>=3.19,<4",
    "pydantic>=2.13,<3",
    "pyzmq>=27.1.0",
    "PyYAML>=6,<7",
    "prompt_toolkit>=3.0,<4",
    "tomli-w>=1.2,<2",
    "yukilog>=1,<2",
    "jsonschema>=4.26,<5",
    "tornado>=6.1,<7",
]

[project.optional-dependencies]
yaml = [
    "PyYAML>=6,<7",
]
http = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
]

[project.scripts]
liteyukibot = "liteyukibot.cli:main"
liteyuki = "liteyukibot.cli:main"
ly = "liteyukibot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "types-PyYAML>=6.0.12,<7",
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
    "maturin>=1.14.1",
    "types-jsonschema>=4.26,<5",
]
release = [
    "cyclonedx-bom>=7.3.1",
    "license-expression>=30.4.4",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot"

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "scripts", "examples", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts", "examples", "packages"]

[[tool.mypy.overrides]]
module = ["license_expression"]
follow_untyped_imports = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.generate_supply_chain"]
disable_error_code = ["no-untyped-call"]
