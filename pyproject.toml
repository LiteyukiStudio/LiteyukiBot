[project]
name = "liteyukibot-v7"
version = "7.0.0a1"
description = "A protocol-neutral, multi-runtime chatbot kernel."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO"
license-files = ["LICENSE"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "pydantic>=2.13,<3",
    "yukilog>=1,<2",
]

[project.optional-dependencies]
yaml = [
    "PyYAML>=6,<7",
]
http = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
]
nonebot = [
    "nonebot2[fastapi,httpx,websockets]>=2.5,<3",
]
onebot = [
    "nonebot-adapter-onebot>=2.4,<3",
]
satori = [
    "nonebot-adapter-satori>=1.3,<2",
]

[project.scripts]
liteyuki = "liteyukibot.cli:main"
ly = "liteyukibot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["liteyukibot", "liteyuki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
