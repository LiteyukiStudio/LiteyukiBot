[project]
name = "liteyukibot-v7"
version = "7.0.0a15"
description = "LiteyukiBot v7 CLI and application composition package."
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-LSO-Common-1.4"
license-files = ["LICENSE", "LICENSE.en", "LICENSE.zh-CN"]
authors = [
    { name = "LiteyukiStudio" },
]
dependencies = [
    "liteyukibot-v7-kernel==7.0.0a15",
    "liteyukibot-v7-cordis==7.0.0a15",
    "liteyukibot-v7-adapter-onebot==7.0.0a15",
    "pydantic>=2.13,<3",
    "PyYAML>=6,<7",
    "tomli-w>=1.2,<2",
    "yukilog>=1,<2",
]

[project.scripts]
liteyuki = "liteyukibot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pip-audit>=2.9,<3",
    "types-PyYAML>=6.0.12,<7",
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]
release = [
    "cyclonedx-bom>=7.3.1",
    "license-expression>=30.4.4",
    "sigstore>=4,<5",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/kernel", "packages/cordis", "packages/adapter-onebot"]
exclude = ["extras/legacy-bridges/*"]

[tool.uv.sources]
liteyukibot-v7 = { workspace = true }
liteyukibot-v7-kernel = { workspace = true }
liteyukibot-v7-cordis = { workspace = true }
liteyukibot-v7-adapter-onebot = { workspace = true }

[tool.uv.build-backend]
module-root = "src"
module-name = "liteyukibot"

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "scripts", "examples", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts", "packages"]

[[tool.mypy.overrides]]
module = ["license_expression"]
follow_untyped_imports = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.generate_supply_chain"]
disable_error_code = ["no-untyped-call"]
